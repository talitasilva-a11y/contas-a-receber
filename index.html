<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agility — Contas a Receber</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --purple:#7063F0;
  --purple-dark:#5347d1;
  --purple-deep:#372E99;
  --purple-light:#EEEBFF;
  --orange:#FF7029;
  --orange-light:#FFE9DD;
  --orange-text:#99400C;
  --dark:#1C1F26;
  --bg:#F5F6FA;
  --card:#FFFFFF;
  --text:#1C1F26;
  --text-muted:#6B7280;
  --border:#E7E8EF;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,31,38,0.06);
  /* cor da campanha do mês (definida via JS) */
  --campanha:#FF7029;
  --campanha-light:#FFE9DD;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;letter-spacing:-0.01em;text-wrap:balance;}
a{color:var(--purple);text-decoration:none;}
a:hover{text-decoration:underline;}
a:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:2px;}
button{font-family:inherit;cursor:pointer;}
table{border-collapse:collapse;width:100%;}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex:none;background:var(--dark);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:40;
}
.sidebar-logo{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-logo img{width:150px;display:block;}
.sidebar-logo .sub{color:#8B8F9E;font-size:11.5px;margin-top:8px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;}
.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav a{text-decoration:none;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin-bottom:2px;border-radius:10px;
  color:#B7BAC6;font-size:13.5px;font-weight:500;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--purple);color:#fff;}
.nav-item svg{width:17px;height:17px;flex:none;}
.nav-toggle{
  background:none;border:0;color:inherit;padding:0;margin-left:-4px;
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex:none;
  transition:transform .15s;
}
.nav-toggle.closed{transform:rotate(-90deg);}
.nav-children{padding-left:22px;}
.nav-children.hidden{display:none;}
.nav-children .nav-item{font-size:13px;padding:8px 12px;}
.sidebar-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);color:#8B8F9E;font-size:11.5px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:20;
}
.topbar .chevron{color:var(--orange);font-family:'Sora',sans-serif;font-weight:800;font-size:20px;}
.topbar h1{font-size:19px;}
.breadcrumb{color:var(--text-muted);font-size:12.5px;margin-left:auto;}
.menu-btn{display:none;background:none;border:0;padding:4px;color:var(--text);}
.menu-btn svg{width:22px;height:22px;}
.content{padding:24px 28px 40px;flex:1;max-width:1300px;width:100%;}

/* ---------- COMPONENTES ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0;}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card h3 .ico{color:var(--purple);display:flex;}
.card h3 .ico svg{width:18px;height:18px;}
.grid{display:grid;gap:18px;}
.grid-home{grid-template-columns:repeat(12,1fr);}
.span-4{grid-column:span 4;}
.span-6{grid-column:span 6;}
.span-8{grid-column:span 8;}
.span-12{grid-column:span 12;}
.muted{color:var(--text-muted);}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--purple-light);color:var(--purple-deep);}
.tag.orange{background:var(--orange-light);color:var(--orange-text);}

.btn{
  display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;
  background:var(--purple);color:#fff;font-weight:600;font-size:13px;padding:10px 16px;text-decoration:none;
}
.btn:hover{background:var(--purple-dark);text-decoration:none;}
.btn.ghost{background:var(--purple-light);color:var(--purple-deep);}
.btn.orange{background:var(--orange);}
.btn svg{width:16px;height:16px;}
.linkbtn{background:none;border:0;padding:0;color:var(--purple);font-weight:600;font-size:12.5px;}

/* hero */
.hero{
  background:linear-gradient(120deg,var(--purple-deep),var(--purple) 70%);
  color:#fff;border-radius:var(--radius);padding:26px 28px;position:relative;overflow:hidden;
}
.hero::after{
  content:"›";position:absolute;right:28px;top:50%;transform:translateY(-55%);
  font-family:'Sora',sans-serif;font-weight:800;font-size:180px;color:rgba(255,255,255,0.08);line-height:1;
}
.hero .hello{font-size:13px;opacity:.85;}
.hero h2{font-size:24px;margin:4px 0 14px;}
.hero .frase{font-size:16px;max-width:760px;font-style:italic;position:relative;z-index:1;}
.hero .frase-autor{font-size:12.5px;opacity:.8;margin-top:6px;}
.hero .frase-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--orange-light);margin-bottom:4px;}

/* campanha */
.campanha{border-left:6px solid var(--campanha);background:linear-gradient(90deg,var(--campanha-light),var(--card) 60%);}
.campanha .laco{width:44px;height:44px;border-radius:12px;background:var(--campanha);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.campanha .laco svg{width:24px;height:24px;}
.campanha-head{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
.campanha-head h4{font-size:17px;}

/* listas */
.list{list-style:none;margin:0;padding:0;}
.list li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
.list li:last-child{border-bottom:0;}
.avatar{
  width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13px;background:var(--purple-light);color:var(--purple-deep);
}
.avatar.orange{background:var(--orange-light);color:var(--orange-text);}
.list .t{font-weight:600;}
.list .s{font-size:12.5px;color:var(--text-muted);}
.dia{margin-left:auto;font-family:'Sora',sans-serif;font-weight:700;color:var(--orange);font-size:13px;white-space:nowrap;}
.hoje{background:var(--orange-light);border-radius:10px;padding-left:8px !important;padding-right:8px !important;}

.noticia{padding:12px 0;border-bottom:1px solid var(--border);}
.noticia:last-child{border-bottom:0;}
.noticia .d{font-size:11.5px;color:var(--text-muted);}
.noticia .t{font-weight:600;margin:2px 0 4px;}
.noticia .r{font-size:12.5px;color:var(--text-muted);white-space:pre-line;overflow-wrap:anywhere;}
.noticia .r.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;}

/* semana do time */
.semana{padding:6px;}
.semana-grid{display:grid;grid-template-columns:repeat(3,1fr);}
.semana-grid > .empty,.semana-grid > .erro{grid-column:1/-1;padding:14px;}
.semana-item{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:12px;color:var(--text);}
.semana-item:hover{background:var(--bg);text-decoration:none;}
.semana-item + .semana-item{border-left:1px solid var(--border);}
.semana-ico{width:42px;height:42px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--purple-light);}
.semana-ico.laranja{background:var(--orange-light);}
.semana-ico.verde{background:#DCFCE7;}
.semana-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--text-muted);}
.semana-quando{font-size:12px;color:var(--purple);font-weight:600;margin-top:2px;}
.semana-valor{font-family:'Sora',sans-serif;font-weight:700;font-size:15.5px;line-height:1.3;margin-top:2px;}
.semana-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.evento.feriado .data{background:var(--orange-light);color:var(--orange-text);}
.evento .faltam{margin-left:auto;font-size:12px;font-weight:700;color:var(--orange);white-space:nowrap;}

/* reconhecimentos */
.rec-card{background:linear-gradient(160deg,#FFF7F1 0%,var(--card) 45%);}
.rec-head,.aniv-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.rec-head h3,.aniv-head h3{margin:0;font-size:17px;}
.rec-trofeu,.aniv-ico{
  width:46px;height:46px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;
  background:linear-gradient(135deg,#FFD66B,#FF9F45);box-shadow:0 4px 12px rgba(255,112,41,.25);
}
.aniv-ico{background:linear-gradient(135deg,#FF9AC8,#B39BFF);box-shadow:0 4px 12px rgba(112,99,240,.25);}
.rec-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--orange);}
.premios{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.premio{
  --c1:#7063F0;--c2:#EEEBFF;
  position:relative;overflow:hidden;border-radius:14px;padding:14px;
  background:linear-gradient(135deg,var(--c2),#fff 75%);border:1px solid color-mix(in srgb,var(--c1) 22%,transparent);
  transition:transform .2s,box-shadow .2s;
}
.premio:hover{transform:translateY(-3px);box-shadow:0 8px 20px color-mix(in srgb,var(--c1) 20%,transparent);}
.premio::after{
  content:"";position:absolute;top:-40%;left:-60%;width:40%;height:180%;transform:rotate(20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:brilho 5s ease-in-out infinite;
}
.premio.laranja{--c1:#FF7029;--c2:#FFE9DD;}
.premio.verde{--c1:#16A34A;--c2:#DCFCE7;}
.premio.azul{--c1:#2563EB;--c2:#DBEAFE;}
.premio-topo{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.premio-emoji{font-size:20px;}
.premio-cat{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--c1);}
.premio-corpo{display:flex;align-items:center;gap:12px;}
.premio-avatar{
  position:relative;width:48px;height:48px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:800;font-size:15px;color:#fff;background:var(--c1);
  box-shadow:0 0 0 3px #fff,0 0 0 5px color-mix(in srgb,var(--c1) 35%,transparent);
}
.premio-medalha{position:absolute;right:-8px;bottom:-6px;font-size:18px;}
.premio-nome{font-family:'Sora',sans-serif;font-weight:700;font-size:15px;line-height:1.25;}
.premio-frase{font-size:12px;color:var(--text-muted);}
.premio-valor{
  margin-top:10px;display:inline-block;font-size:12px;color:var(--c1);font-weight:600;
  background:#fff;border-radius:999px;padding:3px 10px;border:1px solid color-mix(in srgb,var(--c1) 25%,transparent);
}
.premio-valor b{font-family:'Sora',sans-serif;font-size:14px;}
.rec-rodape{margin-top:14px;font-size:12.5px;color:var(--text-muted);text-align:center;}
@keyframes brilho{0%,70%{left:-60%;}100%{left:130%;}}

/* aniversários */
.aniv-card{background:linear-gradient(170deg,#F4F0FF 0%,var(--card) 50%);}
.festa{
  position:relative;overflow:hidden;text-align:center;border-radius:14px;padding:20px 14px 16px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--purple-deep),var(--purple) 55%,#B074F0);color:#fff;
}
.festa-bolo{font-size:40px;line-height:1;animation:pula 1.6s ease-in-out infinite;}
.festa-tag{display:inline-block;margin-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;background:var(--orange);border-radius:999px;padding:3px 10px;}
.festa-nome{font-family:'Sora',sans-serif;font-weight:800;font-size:20px;margin-top:8px;}
.festa-msg{font-size:12.5px;opacity:.9;margin-top:4px;}
.confete{position:absolute;inset:0;pointer-events:none;}
.confete i{
  position:absolute;top:-12px;left:calc(var(--i) * 5.6%);width:7px;height:11px;border-radius:2px;opacity:.9;
  background:hsl(calc(var(--i) * 47) 95% 65%);
  animation:cai calc(2.6s + (var(--i) * 0.13s)) linear infinite;animation-delay:calc(var(--i) * -0.37s);
}
.confete i:nth-child(3n){width:8px;height:8px;border-radius:50%;}
@keyframes cai{0%{transform:translateY(0) rotate(0);}100%{transform:translateY(240px) rotate(540deg);}}
@keyframes pula{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.aniv-lista{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
.aniv-lista li{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:8px 10px;}
.aniv-lista li.passou{opacity:.6;}
.aniv-lista .t{font-weight:600;}
.aniv-lista .s{font-size:12px;color:var(--text-muted);}
.aniv-data{width:44px;flex:none;text-align:center;border-radius:10px;padding:4px 0;background:linear-gradient(135deg,#FFB3D6,#C7B8FF);color:var(--purple-deep);}
.aniv-data b{display:block;font-family:'Sora',sans-serif;font-size:17px;line-height:1.1;}
.aniv-data span{font-size:10px;text-transform:uppercase;font-weight:700;}
.aniv-emoji{margin-left:auto;font-size:20px;}
.aniv-vazio{text-align:center;color:var(--text-muted);padding:18px 0;font-size:13px;}
.aniv-vazio div{font-size:30px;margin-bottom:6px;}

.noticias-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 28px;}
.noticias-grid .noticia:nth-last-child(2):nth-child(odd){border-bottom:0;}
.noticias-grid > .empty,.noticias-grid > .erro{grid-column:1/-1;}

.opiniao{background:var(--dark);color:#fff;border:0;}
.opiniao h3{color:#fff;}
.opiniao p{color:#B7BAC6;margin:0 0 16px;}

/* páginas internas */
.page-intro{margin-bottom:18px;max-width:820px;}
.page-intro p{color:var(--text-muted);margin:6px 0 0;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.tile{
  display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;color:var(--text);box-shadow:var(--shadow);transition:border-color .15s,transform .15s;
}
.tile:hover{border-color:var(--purple);transform:translateY(-2px);text-decoration:none;}
.tile .ti{width:38px;height:38px;border-radius:10px;background:var(--purple-light);color:var(--purple);display:flex;align-items:center;justify-content:center;}
.tile .ti svg{width:20px;height:20px;}
.tile .tt{font-family:'Sora',sans-serif;font-weight:700;font-size:14.5px;}
.tile .td{font-size:12.5px;color:var(--text-muted);}
.tile .tc{font-size:11px;color:var(--purple);font-weight:600;margin-top:auto;}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;margin:28px 0 12px;}
.prose{max-width:860px;}
.prose p{margin:0 0 12px;}
.prose h3{font-size:16px;margin:22px 0 8px;}
.prose ul{margin:0 0 12px;padding-left:20px;}
.prose li{margin-bottom:4px;}
.empty{color:var(--text-muted);font-size:13px;padding:10px 0;}
.erro{color:#B91C1C;font-size:13px;padding:10px 0;}

/* em breve */
.breve{
  background:var(--card);border:1px dashed #C9CBD8;border-radius:var(--radius);
  padding:40px 24px;text-align:center;max-width:620px;
}
.breve .ti{width:52px;height:52px;margin:0 auto 14px;border-radius:14px;background:var(--orange-light);color:var(--orange);display:flex;align-items:center;justify-content:center;}
.breve .ti svg{width:26px;height:26px;}
.breve h3{font-size:18px;margin-bottom:6px;}
.breve p{color:var(--text-muted);margin:0;}

/* quem somos */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 6px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.stat b{display:block;font-family:'Sora',sans-serif;font-size:24px;color:var(--purple-deep);font-variant-numeric:tabular-nums;}
.stat span{font-size:12.5px;color:var(--text-muted);}
.mvv{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:6px;}
.mvv .card h3{color:var(--purple-deep);}
.mvv p{margin:0;}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:var(--purple-light);color:var(--purple-deep);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:999px;}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--border);margin-left:30px;}
.timeline > li{position:relative;padding:0 0 22px 26px;}
.timeline > li:last-child{padding-bottom:0;}
.timeline ul li{margin-bottom:2px;}
.timeline .ano{
  position:absolute;left:-31px;top:0;transform:translateX(-50%);
  background:var(--purple);color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:12px;
  padding:3px 8px;border-radius:999px;font-variant-numeric:tabular-nums;
}
.timeline h4{font-size:14.5px;margin:0 0 4px;padding-top:1px;}
.timeline p{margin:0;color:var(--text-muted);}
.timeline ul{margin:4px 0 0;padding-left:18px;color:var(--text-muted);}

/* fale com o time */
.tbl-wrap{overflow-x:auto;}
.tbl{font-size:13px;}
.tbl th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11.5px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
.tbl tr:last-child td{border-bottom:0;}
.tbl .ramal{font-family:'Sora',sans-serif;font-weight:700;color:var(--purple-deep);font-variant-numeric:tabular-nums;}
.tbl .mail a{display:block;}

/* agenda */
.evento{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.evento:last-child{border-bottom:0;}
.evento .data{width:56px;flex:none;text-align:center;background:var(--purple-light);border-radius:10px;padding:6px 0;color:var(--purple-deep);}
.evento .data b{display:block;font-family:'Sora',sans-serif;font-size:20px;line-height:1.1;}
.evento .data span{font-size:11px;text-transform:uppercase;font-weight:600;}
.evento.passado{opacity:.55;}
.escala tr.prox td{background:var(--orange-light);}
.escala tr.passado td{opacity:.5;}
.escala td{white-space:nowrap;}

/* comissionamento */
.callout{background:var(--purple-light);border-radius:12px;padding:14px 16px;color:var(--purple-deep);font-size:13px;margin:12px 0;}
.valor{font-family:'Sora',sans-serif;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
.pos{color:#15803D;}
.neg{color:#B91C1C;}

/* footer */
.footer{background:var(--dark);color:#B7BAC6;padding:28px 28px 18px;margin-top:auto;}
.footer-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px;max-width:1300px;}
.footer h4{color:#fff;font-size:13px;margin-bottom:10px;}
.footer a{color:#B7BAC6;}
.footer a:hover{color:#fff;}
.footer ul{list-style:none;margin:0;padding:0;}
.footer li{margin-bottom:6px;font-size:13px;}
.footer .addr{font-size:13px;white-space:pre-line;}
.footer .copy{border-top:1px solid rgba(255,255,255,0.08);margin-top:20px;padding-top:14px;font-size:11.5px;color:#6B7080;}

.overlay{display:none;}

@media (max-width:1100px){
  .span-4,.span-6,.span-8{grid-column:span 12;}
  .stats{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:none;}

// Normaliza o título da coluna: minúsculas, sem acento, sem espaços extras
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/\s+/g, " ").trim();
const pega = (linha, ...nomes) => { for (const n of nomes) { const v = linha[norm(n)]; if (v != null && String(v).trim() !== "") return String(v).trim(); } return ""; };

let dadosPlanilha = null;
function carregarPlanilha(){
  if (dadosPlanilha) return dadosPlanilha;
  const urls = C.planilha.abas.map(g => `${C.planilha.base}?gid=${g}&single=true&output=csv`);
  dadosPlanilha = Promise.all(urls.map(u =>
    fetch(u).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
      .then(txt => Papa.parse(txt, { header:true, skipEmptyLines:true, transformHeader: norm }).data)
      .catch(err => { console.warn("Falha ao ler aba", u, err); return null; })
  )).then(abas => {
    const out = { colaboradores:null, reconhecimentos:null, noticias:null, agenda:null, escala:null };
    abas.forEach(linhas => {
      if (!linhas || !linhas.length) return;
      const cols = Object.keys(linhas[0]);
      if (cols.includes("trabalham") || cols.includes("folgam")) out.escala = linhas;
      else if (cols.includes("evento")) out.agenda = linhas;
      else if (cols.includes("aniversario") || cols.includes("ramal")) out.colaboradores = linhas;
      else if (cols.includes("parceiro do mes") || cols.includes("atitude de impacto")) out.reconhecimentos = linhas;
      else if (cols.includes("titulo") || cols.includes("noticia")) out.noticias = linhas;
    });
    return out;
  });
  return dadosPlanilha;
}
const DIAS_SEM = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const isoData = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const isoHoje = iso(hoje);
const ddmm = d => `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
const diasAte = s => Math.round((isoData(s) - isoData(isoHoje)) / 864e5);
// "17/10/2026" ou "17/10" → "2026-10-17" (sem ano, usa o ano atual)
function isoBR(s){
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?/);
  if (!m) return "";
  let y = m[3] ? +m[3] : hoje.getFullYear(); if (y < 100) y += 2000;
  return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
}

/* Feriados nacionais (calculados para qualquer ano; a Páscoa define a Sexta-feira Santa) */
function pascoa(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
        h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
        mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(y, mes-1, dia);
}
function feriados(y){
  const sexta = pascoa(y); sexta.setDate(sexta.getDate() - 2);
  return [
    ["01-01","Confraternização Universal"],[iso(sexta).slice(5),"Sexta-feira Santa"],["04-21","Tiradentes"],
    ["05-01","Dia do Trabalho"],["09-07","Independência do Brasil"],["10-12","Nossa Senhora Aparecida"],
    ["11-02","Finados"],["11-15","Proclamação da República"],["11-20","Dia Nacional de Zumbi e da Consciência Negra"],
    ["12-25","Natal"]
  ].map(([md, nome]) => ({ data:`${y}-${md}`, nome })).sort((a,b) => a.data.localeCompare(b.data));
}
const feriadosProximos = () => [...feriados(hoje.getFullYear()), ...feriados(hoje.getFullYear()+1)].filter(f => f.data >= isoHoje);
const feriadoEm = s => feriados(+s.slice(0,4)).find(f => f.data === s);

/* Agenda e escala: vêm das abas "Agenda" e "Escala" da planilha quando existirem;
   senão, usam o conteúdo fixo do topo do arquivo. */
function eventosDe(d){
  if (d && d.agenda) return d.agenda.map(l => ({
    data: isoBR(pega(l, "data")), titulo: pega(l, "evento"), hora: pega(l, "horario", "hora"), local: pega(l, "local")
  })).filter(e => e.data && e.titulo).sort((a,b) => a.data.localeCompare(b.data));
  return [...C.eventos].sort((a,b) => a.data.localeCompare(b.data));
}
function escalaDe(d){
  if (d && d.escala){
    const linhas = d.escala.map(l => ({
      data: isoBR(pega(l, "sabado", "data")), trabalham: pega(l, "trabalham"), folgam: pega(l, "folgam"), obs: pega(l, "observacao", "obs")
    })).filter(l => l.data && l.trabalham).sort((a,b) => a.data.localeCompare(b.data));
    const ini = linhas[0], fim = linhas[linhas.length-1];
    return { linhas, duplas: "", titulo: linhas.length ? `Escala de sábados — ${ddmm(isoData(ini.data))} a ${ddmm(isoData(fim.data))}/${fim.data.slice(0,4)}` : "Escala de sábados" };
  }
  return C.escalaSabados;
}

const msgErro = `<div class="erro">Não foi possível carregar a planilha. Verifique se ela continua publicada na web (Arquivo › Compartilhar › Publicar na Web).</div>`;
const carregando = `<div class="empty">Carregando…</div>`;

function colaboradores(d){
  return (d.colaboradores || []).map(l => {
    const [dia, mes] = pega(l, "aniversario").split("/").map(n => parseInt(n, 10));
    return {
      nome: pega(l, "nome"),
      dia, mes,
      ramal: pega(l, "ramal"),
      emails: pega(l, "e-mail", "email").split(/[;,\s]+/).filter(e => e.includes("@"))
    };
  }).filter(c => c.nome);
}
// "10/2026" → "2026-10"
function chaveMes(s){
  const m = String(s).match(/(\d{1,2})\s*\/\s*(\d{4})/);
  return m ? `${m[2]}-${m[1].padStart(2,"0")}` : "";
}
const mesLabel = k => { const [y,m] = k.split("-").map(Number); return `${cap(MESES[m-1])}/${y}`; };
// "05/10/2026" → Date
function dataBR(s){
  const m = String(s).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}
const fmtData = d => `${String(d.getDate()).padStart(2,"0")} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`;

          <div class="semana-quando">${cap(DIAS_SEM[isoData(fer.data).getDay()])}, ${ddmm(isoData(fer.data))} · ${quandoTxt(fer.data)}</div>

function eventoHtml(e){
  const d = isoData(e.data);
  const info = [cap(DIAS_SEM[d.getDay()]), e.hora, e.local].filter(Boolean).join(" · ");
  return `<div class="evento${e.data < isoHoje ? " passado" : ""}">
    <div class="data"><b>${String(d.getDate()).padStart(2,"0")}</b><span>${MESES[d.getMonth()].slice(0,3)}</span></div>
    <div><div style="font-weight:600">${esc(e.titulo)}${e.data === isoHoje ? ' <span class="tag orange">Hoje</span>' : ""}</div>
    <div class="muted" style="font-size:12.5px">${esc(info)}</div></div>
  </div>`;
}
function feriadoHtml(f){
  const d = isoData(f.data), n = diasAte(f.data);
  return `<div class="evento feriado">
    <div class="data"><b>${String(d.getDate()).padStart(2,"0")}</b><span>${MESES[d.getMonth()].slice(0,3)}</span></div>
    <div><div style="font-weight:600">${esc(f.nome)}</div>
    <div class="muted" style="font-size:12.5px">${cap(DIAS_SEM[d.getDay()])} · Folga de todos</div></div>
    <div class="faltam">${n === 0 ? "Hoje" : n === 1 ? "Amanhã" : `em ${n} dias`}</div>
  </div>`;
}
function pageAgenda(){
  return intro("Agenda", "Feedbacks, reuniões, escala de sábados e feriados do setor.") + `<div id="boxAgenda">${carregando}</div>`;
}
async function preencherAgenda(){
  const d = await carregarPlanilha();
  const box = $("#boxAgenda"); if (!box) return;
  const ev = eventosDe(d);
  const prox = ev.filter(e => e.data >= isoHoje), pass = ev.filter(e => e.data < isoHoje).reverse();
  const E = escalaDe(d);
  const proxSab = (E.linhas.find(l => l.data >= isoHoje) || {}).data;
  const fer = feriadosProximos().slice(0, 6);
  box.innerHTML =
    `<div class="section-title" style="margin-top:0">Próximos eventos</div>
     <div class="card">${prox.length ? prox.map(eventoHtml).join("") : `<div class="empty">Nenhum evento agendado.</div>`}</div>
     <div class="section-title">${esc(E.titulo)}</div>
     ${E.duplas ? `<p class="muted" style="margin:-4px 0 12px">${esc(E.duplas)}</p>` : ""}
     ${E.linhas.length ? `<div class="card" style="padding:0"><div class="tbl-wrap"><table class="tbl escala">
       <thead><tr><th>Sábado</th><th>Trabalham</th><th>Folgam</th><th>Observação</th></tr></thead>
       <tbody>${E.linhas.map(l => {
         const cls = l.data === proxSab ? "prox" : l.data < isoHoje ? "passado" : "";
         const fer = feriadoEm(l.data);
         return `<tr class="${cls}">
           <td class="ramal">${ddmm(isoData(l.data))}${l.data === proxSab ? ' <span class="tag orange">Próximo</span>' : ""}</td>
           <td><b>${esc(l.trabalham)}</b></td>
           <td class="muted">${esc(l.folgam)}</td>
           <td class="muted">${esc([fer ? `Feriado: ${fer.nome}` : "", l.obs].filter(Boolean).join(" · ") || "—")}</td>
         </tr>`; }).join("")}</tbody>
     </table></div></div>` : `<div class="card"><div class="empty">A escala de sábados ainda não foi publicada.</div></div>`}
     <div class="section-title">Próximos feriados nacionais</div>
     <div class="card">${fer.map(feriadoHtml).join("")}</div>` +
    (pass.length ? `<div class="section-title">Eventos realizados</div><div class="card">${pass.map(eventoHtml).join("")}</div>` : "");
}

function rotaAtual(){ const r = location.hash.slice(1); return RENDER[r] ? r : "home"; }
function navegar(){
  const r = rotaAtual();
  if (pai[r]) abertos.add(pai[r].id);
  renderNav(r);
  $("#pageTitle").textContent = titulo[r];
  $("#breadcrumb").textContent = pai[r] ? `${pai[r].titulo} › ${titulo[r]}` : (r === "home" ? "" : titulo[r]);

  $("#content").innerHTML = RENDER[r]();
  if (APOS[r]) APOS[r]();
  fecharMenu();
  window.scrollTo(0,0);
}
