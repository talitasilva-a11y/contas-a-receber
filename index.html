<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agility — Contas a Receber</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --purple:#7063F0;
  --purple-dark:#5347d1;
  --purple-deep:#372E99;
  --purple-light:#EEEBFF;
  --orange:#FF7029;
  --orange-light:#FFE9DD;
  --dark:#1C1F26;
  --dark-2:#262A33;
  --bg:#F5F6FA;
  --card:#FFFFFF;
  --text:#1C1F26;
  --text-muted:#6B7280;
  --border:#E7E8EF;
  --radius:14px;
  --shadow:0 2px 10px rgba(28,31,38,0.06);
  /* cor da campanha do mês (definida via JS) */
  --campanha:#FF7029;
  --campanha-light:#FFE9DD;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Sora',sans-serif;margin:0;letter-spacing:-0.01em;}
a{color:var(--purple);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:inherit;cursor:pointer;}
table{border-collapse:collapse;width:100%;}

/* ---------- LAYOUT ---------- */
#app{display:flex;min-height:100vh;}
.sidebar{
  width:250px;flex:none;background:var(--dark);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:40;
}
.sidebar-logo{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.08);}
.sidebar-logo img{width:150px;display:block;}
.sidebar-logo .sub{color:#8B8F9E;font-size:11.5px;margin-top:8px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;}
.nav{flex:1;padding:14px 10px;overflow-y:auto;}
.nav a{text-decoration:none;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;margin-bottom:2px;border-radius:10px;
  color:#B7BAC6;font-size:13.5px;font-weight:500;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:var(--purple);color:#fff;}
.nav-item svg{width:17px;height:17px;flex:none;}
.nav-toggle{
  background:none;border:0;color:inherit;padding:0;margin-left:-4px;
  width:16px;height:16px;display:flex;align-items:center;justify-content:center;flex:none;
  transition:transform .15s;
}
.nav-toggle.closed{transform:rotate(-90deg);}
.nav-children{padding-left:22px;}
.nav-children.hidden{display:none;}
.nav-children .nav-item{font-size:13px;padding:8px 12px;}
.sidebar-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);color:#8B8F9E;font-size:11.5px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  background:var(--card);border-bottom:1px solid var(--border);
  padding:14px 28px;display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:20;
}
.topbar .chevron{color:var(--orange);font-family:'Sora',sans-serif;font-weight:800;font-size:20px;}
.topbar h1{font-size:19px;}
.breadcrumb{color:var(--text-muted);font-size:12.5px;margin-left:auto;}
.menu-btn{display:none;background:none;border:0;padding:4px;color:var(--text);}
.menu-btn svg{width:22px;height:22px;}
.content{padding:24px 28px 40px;flex:1;max-width:1300px;width:100%;}

/* ---------- COMPONENTES ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card h3 .ico{color:var(--purple);display:flex;}
.card h3 .ico svg{width:18px;height:18px;}
.grid{display:grid;gap:18px;}
.grid-home{grid-template-columns:repeat(12,1fr);}
.span-4{grid-column:span 4;}
.span-6{grid-column:span 6;}
.span-8{grid-column:span 8;}
.span-12{grid-column:span 12;}
.muted{color:var(--text-muted);}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--purple-light);color:var(--purple-deep);}
.tag.orange{background:var(--orange-light);color:#99400C;}
.exemplo{font-size:11px;color:var(--text-muted);font-style:italic;margin-top:10px;}

.btn{
  display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;
  background:var(--purple);color:#fff;font-weight:600;font-size:13px;padding:10px 16px;text-decoration:none;
}
.btn:hover{background:var(--purple-dark);text-decoration:none;}
.btn.ghost{background:var(--purple-light);color:var(--purple-deep);}
.btn.orange{background:var(--orange);}
.btn svg{width:16px;height:16px;}

/* hero */
.hero{
  background:linear-gradient(120deg,var(--purple-deep),var(--purple) 70%);
  color:#fff;border-radius:var(--radius);padding:26px 28px;position:relative;overflow:hidden;
}
.hero::after{
  content:"›";position:absolute;right:28px;top:50%;transform:translateY(-55%);
  font-family:'Sora',sans-serif;font-weight:800;font-size:180px;color:rgba(255,255,255,0.08);line-height:1;
}
.hero .hello{font-size:13px;opacity:.85;}
.hero h2{font-size:24px;margin:4px 0 14px;}
.hero .frase{font-size:16px;max-width:760px;font-style:italic;position:relative;z-index:1;}
.hero .frase-autor{font-size:12.5px;opacity:.8;margin-top:6px;}
.hero .frase-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--orange-light);margin-bottom:4px;}

/* campanha */
.campanha{border-left:6px solid var(--campanha);background:linear-gradient(90deg,var(--campanha-light),var(--card) 60%);}
.campanha .laco{width:44px;height:44px;border-radius:12px;background:var(--campanha);display:flex;align-items:center;justify-content:center;color:#fff;flex:none;}
.campanha .laco svg{width:24px;height:24px;}
.campanha-head{display:flex;gap:14px;align-items:center;margin-bottom:10px;}
.campanha-head h4{font-size:17px;}

/* listas */
.list{list-style:none;margin:0;padding:0;}
.list li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);}
.list li:last-child{border-bottom:0;}
.avatar{
  width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:700;font-size:13px;background:var(--purple-light);color:var(--purple-deep);
}
.avatar.orange{background:var(--orange-light);color:#99400C;}
.list .t{font-weight:600;}
.list .s{font-size:12.5px;color:var(--text-muted);}
.dia{margin-left:auto;font-family:'Sora',sans-serif;font-weight:700;color:var(--orange);font-size:13px;white-space:nowrap;}
.hoje{background:var(--orange-light);border-radius:10px;padding-left:8px !important;padding-right:8px !important;}

.noticia{display:block;padding:12px 0;border-bottom:1px solid var(--border);color:var(--text);}
.noticia:last-child{border-bottom:0;}
.noticia:hover{text-decoration:none;}
.noticia:hover .t{color:var(--purple);}
.noticia .d{font-size:11.5px;color:var(--text-muted);}
.noticia .t{font-weight:600;margin:2px 0;}
.noticia .r{font-size:12.5px;color:var(--text-muted);}

.opiniao{background:var(--dark);color:#fff;border:0;}
.opiniao h3{color:#fff;}
.opiniao p{color:#B7BAC6;margin:0 0 16px;}

/* indicadores */
.ind-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.ind-head h3{margin:0;}
.ind-head .filters{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.select{border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:7px 10px;font-size:12.5px;color:var(--text);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:var(--bg);border-radius:12px;padding:12px 14px;}
.kpi .l{font-size:11.5px;color:var(--text-muted);font-weight:600;}
.kpi .v{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;margin-top:2px;}
.ind-body{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:start;}
.chart-box{position:relative;height:280px;}
.tbl{font-size:12.5px;}
.tbl th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11.5px;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{padding:8px;border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:0;}
.tbl td.n{text-align:right;font-variant-numeric:tabular-nums;}
.tbl th.n{text-align:right;}
.meta-ok{color:#15803D;font-weight:600;}
.meta-no{color:#B91C1C;font-weight:600;}
.tbl-wrap{overflow-x:auto;}

/* páginas internas */
.page-intro{margin-bottom:18px;max-width:820px;}
.page-intro p{color:var(--text-muted);margin:6px 0 0;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.tile{
  display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;color:var(--text);box-shadow:var(--shadow);transition:border-color .15s,transform .15s;
}
.tile:hover{border-color:var(--purple);transform:translateY(-2px);text-decoration:none;}
.tile .ti{width:38px;height:38px;border-radius:10px;background:var(--purple-light);color:var(--purple);display:flex;align-items:center;justify-content:center;}
.tile .ti svg{width:20px;height:20px;}
.tile .tt{font-family:'Sora',sans-serif;font-weight:700;font-size:14.5px;}
.tile .td{font-size:12.5px;color:var(--text-muted);}
.tile .tc{font-size:11px;color:var(--purple);font-weight:600;margin-top:auto;}
.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);font-weight:700;margin:26px 0 12px;}
.section-title:first-child{margin-top:0;}
.prose{max-width:860px;}
.prose p{margin:0 0 12px;}
.prose h3{font-size:16px;margin:20px 0 8px;}
.prose ul{margin:0 0 12px;padding-left:20px;}
.valores{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:8px;}
.valor{background:var(--purple-light);border-radius:12px;padding:14px;}
.valor b{display:block;font-family:'Sora',sans-serif;color:var(--purple-deep);margin-bottom:4px;}
.equipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.membro{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;}
.evento{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}
.evento:last-child{border-bottom:0;}
.evento .data{
  width:56px;flex:none;text-align:center;background:var(--purple-light);border-radius:10px;padding:6px 0;color:var(--purple-deep);
}
.evento .data b{display:block;font-family:'Sora',sans-serif;font-size:20px;line-height:1.1;}
.evento .data span{font-size:11px;text-transform:uppercase;font-weight:600;}
.evento.passado{opacity:.55;}
.faixas td,.faixas th{padding:10px 12px;}
.callout{background:var(--orange-light);border-radius:12px;padding:14px 16px;color:#7A330A;font-size:13px;margin:12px 0;}
.empty{color:var(--text-muted);font-size:13px;padding:10px 0;}

/* footer */
.footer{background:var(--dark);color:#B7BAC6;padding:28px 28px 18px;margin-top:auto;}
.footer-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:24px;max-width:1300px;}
.footer h4{color:#fff;font-size:13px;margin-bottom:10px;}
.footer a{color:#B7BAC6;}
.footer a:hover{color:#fff;}
.footer ul{list-style:none;margin:0;padding:0;}
.footer li{margin-bottom:6px;font-size:13px;}
.footer .addr{font-size:13px;white-space:pre-line;}
.footer .copy{border-top:1px solid rgba(255,255,255,0.08);margin-top:20px;padding-top:14px;font-size:11.5px;color:#6B7080;}

.overlay{display:none;}

@media (max-width:1100px){
  .span-4,.span-6,.span-8{grid-column:span 12;}
  .ind-body{grid-template-columns:1fr;}
}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;}
  .sidebar.open{transform:none;}
  .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;}
  .menu-btn{display:flex;}
  .topbar{padding:12px 16px;}
  .breadcrumb{display:none;}
  .content{padding:16px 16px 32px;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .footer{padding:24px 16px 16px;}
  .footer-grid{grid-template-columns:1fr;}
  .hero{padding:22px 18px;}
  .hero::after{display:none;}
}
</style>
</head>
<body>

<script>
/* =====================================================================

    { mes: "2026-10", nome: "Colaborador(a) B", titulo: "Melhor recuperação",    motivo: "Maior volume de acordos fechados." },

    { mes:"2026-10", agente:"Agente 3", atendimentos:233, satisfacao:88, resolucao:91, tma:7.1 },

    { mes:"2026-10", agente:"Agente 5", atendimentos:214, satisfacao:96, resolucao:88, tma:7.4 }

  /* ---------- CENTRAL DE TRABALHO ---------- */
  centralIntro: "Tudo o que você precisa no dia a dia: materiais de apoio, acesso às plataformas e planilhas do setor.",
  materialApoio: [
    // categoria agrupa os itens na página
    { categoria: "Procedimentos", titulo: "Manual de cobrança",          descricao: "Passo a passo do fluxo de cobrança.",       link: "#" },
    { categoria: "Procedimentos", titulo: "Roteiro de negociação",       descricao: "Script e boas práticas de negociação.",     link: "#" },
    { categoria: "Procedimentos", titulo: "Baixa de títulos",            descricao: "Como registrar pagamentos e baixas.",      link: "#" },

/* ---------- INDICADORES ---------- */
let dadosInd = null, grafico = null;
async function carregarIndicadores(){
  if (dadosInd) return dadosInd;
  if (C.indicadoresCsv && window.Papa){
    try{
      const txt = await (await fetch(C.indicadoresCsv)).text();
      const r = Papa.parse(txt, { header:true, skipEmptyLines:true });
      const num = v => parseFloat(String(v ?? "").replace("%","").replace(",", "."));
      dadosInd = r.data.map(l => {
        const o = {}; Object.keys(l).forEach(k => o[k.trim().toLowerCase()] = l[k]);
        return { mes:String(o.mes||"").trim(), agente:String(o.agente||"").trim(), atendimentos:num(o.atendimentos),
                 satisfacao:num(o.satisfacao), resolucao:num(o.resolucao), tma:num(o.tma) };
      }).filter(d => d.mes && d.agente);
      if (dadosInd.length) return dadosInd;
    }catch(e){ console.warn("Falha ao carregar CSV de indicadores", e); }
  }
  dadosInd = C.indicadores;
  return dadosInd;
}
function okMeta(k, v){
  const m = C.metas[k]; if (m == null || isNaN(v)) return "";
  return (k === "tma" ? v <= m : v >= m) ? "meta-ok" : "meta-no";
}
const fmtN = (v, d=0) => isNaN(v) ? "—" : v.toLocaleString("pt-BR", { minimumFractionDigits:d, maximumFractionDigits:d });

async function montarIndicadores(){
  const dados = await carregarIndicadores();
  const box = $("#indConteudo"); if (!box) return;
  if (!dados.length){ box.innerHTML = `<div class="empty">Nenhum indicador cadastrado.</div>`; return; }
  const meses = [...new Set(dados.map(d => d.mes))].sort().reverse();
  const selMes = $("#indMes"), selMet = $("#indMetrica");
  selMes.innerHTML = meses.map(m => `<option value="${esc(m)}">${esc(mesLabel(m))}</option>`).join("");
  const desenhar = () => {
    const mes = selMes.value, met = selMet.value;
    const linhas = dados.filter(d => d.mes === mes).sort((a,b) => a.agente.localeCompare(b.agente,"pt-BR"));
    const tot = linhas.reduce((s,d) => s + (d.atendimentos||0), 0);
    const media = k => { const p = linhas.filter(d => !isNaN(d[k]) && d.atendimentos); const w = p.reduce((s,d)=>s+d.atendimentos,0); return w ? p.reduce((s,d)=>s+d[k]*d.atendimentos,0)/w : NaN; };
    const ms = media("satisfacao"), mr = media("resolucao"), mt = media("tma");
    box.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="l">Atendimentos</div><div class="v">${fmtN(tot)}</div></div>
        <div class="kpi"><div class="l">Satisfação média</div><div class="v ${okMeta("satisfacao",ms)}">${fmtN(ms,1)}%</div></div>
        <div class="kpi"><div class="l">Resolução média</div><div class="v ${okMeta("resolucao",mr)}">${fmtN(mr,1)}%</div></div>
        <div class="kpi"><div class="l">TMA médio</div><div class="v ${okMeta("tma",mt)}">${fmtN(mt,1)} min</div></div>
      </div>
      <div class="ind-body">
        <div class="chart-box"><canvas id="indChart"></canvas></div>
        <div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>Agente</th><th class="n">Atend.</th><th class="n">Satisf.</th><th class="n">Resol.</th><th class="n">TMA</th></tr></thead>
          <tbody>${linhas.map(d => `<tr>
            <td>${esc(d.agente)}</td>
            <td class="n">${fmtN(d.atendimentos)}</td>
            <td class="n ${okMeta("satisfacao",d.satisfacao)}">${fmtN(d.satisfacao,1)}%</td>
            <td class="n ${okMeta("resolucao",d.resolucao)}">${fmtN(d.resolucao,1)}%</td>
            <td class="n ${okMeta("tma",d.tma)}">${fmtN(d.tma,1)}</td></tr>`).join("")}</tbody>
        </table>
        <div class="exemplo">Metas: satisfação ≥ ${C.metas.satisfacao}% · resolução ≥ ${C.metas.resolucao}% · TMA ≤ ${C.metas.tma} min. Verde = dentro da meta.</div>
        ${C.indicadoresCsv ? "" : `<div class="exemplo">Dados de exemplo — conecte a planilha em <code>indicadoresCsv</code>.</div>`}
        </div>
      </div>`;
    if (!window.Chart){ $(".chart-box").style.display = "none"; return; }
    if (grafico) grafico.destroy();
    const meta = C.metas[met];
    grafico = new Chart($("#indChart"), {
      type:"bar",
      data:{ labels: linhas.map(d => d.agente), datasets:[{
        data: linhas.map(d => d[met]),
        backgroundColor: linhas.map(d => meta == null ? "#7063F0" : (okMeta(met,d[met]) === "meta-ok" ? "#7063F0" : "#FF7029")),
        borderRadius:6, maxBarThickness:42
      }]},
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label: c => " " + fmtN(c.parsed.y, met==="atendimentos"?0:1) + (met==="tma"?" min":met==="atendimentos"?"":"%") } } },
        scales:{ y:{ beginAtZero: met !== "satisfacao" && met !== "resolucao", grid:{color:"#EEF0F5"}, ticks:{font:{size:11}} }, x:{ grid:{display:false}, ticks:{font:{size:11}} } }
      }
    });
  };
  selMes.onchange = desenhar; selMet.onchange = desenhar;
  desenhar();
}

/* ---------- CENTRAL DE TRABALHO ---------- */
function tiles(lista, icone){
  if (!lista.length) return `<div class="empty">Nenhum item cadastrado.</div>`;
  return `<div class="tiles">${lista.map(i => `
    <a class="tile" href="${esc(i.link)}"${ext(i.link)}>
      <div class="ti">${I[icone]}</div>
      <div class="tt">${esc(i.titulo)}</div>
      <div class="td">${esc(i.descricao||"")}</div>
      <div class="tc">Abrir ›</div>
    </a>`).join("")}</div>`;
}
function intro(t, txt){ return `<div class="page-intro"><h2 style="font-size:20px">${esc(t)}</h2>${txt?`<p>${esc(txt)}</p>`:""}</div>`; }

function pageCentral(){
  const secoes = [
    { id:"material", t:"Material de Apoio", ic:"book", d:"Manuais, procedimentos, treinamentos e modelos.", n:C.materialApoio.length },
    { id:"plataformas", t:"Plataformas", ic:"monitor", d:"Acesso rápido aos sistemas usados no setor.", n:C.plataformas.length },
    { id:"planilhas", t:"Planilhas", ic:"sheet", d:"Planilhas de controle e acompanhamento.", n:C.planilhas.length }
  ];
  return intro("Central de Trabalho", C.centralIntro) + tiles(secoes.map(s => ({ titulo:s.t, descricao:`${s.d} (${s.n} ${s.n===1?"item":"itens"})`, link:"#"+s.id })), "page")
    + `<div class="section-title" style="margin-top:28px">Acesso rápido às plataformas</div>` + tiles(C.plataformas, "monitor");
}
function pageMaterial(){
  const cats = [...new Set(C.materialApoio.map(m => m.categoria || "Geral"))];
  return intro("Material de Apoio", "Documentos e materiais de consulta para o dia a dia.") +
    (cats.length ? cats.map(c => `<div class="section-title">${esc(c)}</div>` + tiles(C.materialApoio.filter(m => (m.categoria||"Geral") === c), "book")).join("") : `<div class="empty">Nenhum material cadastrado.</div>`);
}
function pagePlataformas(){ return intro("Plataformas", "Links de acesso aos sistemas utilizados pelo setor.") + tiles(C.plataformas, "monitor"); }
function pagePlanilhas(){ return intro("Planilhas", "Planilhas de controle e acompanhamento do setor.") + tiles(C.planilhas, "sheet"); }

/* ---------- COMUNICAÇÃO INTERNA ---------- */
function pageComunicacao(){
  const proximos = C.agenda.filter(e => e.data >= isoHoje()).sort((a,b) => a.data.localeCompare(b.data)).slice(0,3);
  return intro("Comunicação Interna", C.comunicacaoIntro) +
    tiles([
      { titulo:"Quem somos", descricao:"Conheça o setor, a missão, os valores e o time.", link:"#quem-somos" },
      { titulo:"Agenda", descricao:"Reuniões, treinamentos e eventos do setor.", link:"#agenda" },
      { titulo:"Regra de Comissionamento", descricao:"Critérios e faixas de comissão.", link:"#comissionamento" }
    ], "users") +
    `<div class="section-title" style="margin-top:28px">Próximos eventos</div>
     <div class="card">${proximos.length ? proximos.map(eventoHtml).join("") : `<div class="empty">Nenhum evento agendado.</div>`}</div>`;
}
function pageQuemSomos(){
  const q = C.quemSomos;
  return `<div class="prose">${intro("Quem somos")}
    ${q.texto.map(p => `<p>${esc(p)}</p>`).join("")}
    ${q.missao ? `<h3>Missão</h3><p>${esc(q.missao)}</p>` : ""}
    ${q.valores.length ? `<h3>Valores</h3><div class="valores">${q.valores.map(v => `<div class="valor"><b>${esc(v.nome)}</b>${esc(v.texto)}</div>`).join("")}</div>` : ""}
    </div>
    ${q.equipe.length ? `<div class="section-title" style="margin-top:28px">Nosso time</div>
    <div class="equipe">${q.equipe.map(m => `<div class="membro"><div class="avatar">${esc(iniciais(m.nome))}</div><div><div style="font-weight:600">${esc(m.nome)}</div><div class="muted" style="font-size:12.5px">${esc(m.cargo)}</div></div></div>`).join("")}</div>` : ""}`;
}
function isoHoje(){ return `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,"0")}-${String(hoje.getDate()).padStart(2,"0")}`; }
function eventoHtml(e){
  const [y,m,d] = e.data.split("-").map(Number);
  return `<div class="evento${e.data < isoHoje() ? " passado" : ""}">
    <div class="data"><b>${String(d).padStart(2,"0")}</b><span>${MESES[m-1].slice(0,3)}</span></div>
    <div><div style="font-weight:600">${esc(e.titulo)}</div><div class="muted" style="font-size:12.5px">${esc(e.hora||"")}${e.hora&&e.local?" · ":""}${esc(e.local||"")}</div></div>
  </div>`;
}
function pageAgenda(){
  const ev = [...C.agenda].sort((a,b) => a.data.localeCompare(b.data));
  const prox = ev.filter(e => e.data >= isoHoje()), pass = ev.filter(e => e.data < isoHoje()).reverse();
  return intro("Agenda", "Reuniões, treinamentos e eventos do setor.") +
    `<div class="section-title">Próximos</div><div class="card">${prox.length ? prox.map(eventoHtml).join("") : `<div class="empty">Nenhum evento agendado.</div>`}</div>` +
    (pass.length ? `<div class="section-title">Realizados</div><div class="card">${pass.map(eventoHtml).join("")}</div>` : "");
}
function pageComissionamento(){
  const c = C.comissionamento;
  return `<div class="prose">${intro("Regra de Comissionamento")}
    ${c.intro ? `<div class="callout">${esc(c.intro)}</div>` : ""}
    <h3>Critérios</h3><ul>${c.criterios.map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <h3>Faixas</h3>
    <div class="card" style="padding:0;overflow-x:auto"><table class="tbl faixas">
      <thead><tr><th>Atingimento</th><th>Comissão</th><th>Observação</th></tr></thead>
      <tbody>${c.faixas.map(f => `<tr><td>${esc(f.faixa)}</td><td><b>${esc(f.percentual)}</b></td><td class="muted">${esc(f.obs)}</td></tr>`).join("")}</tbody>
    </table></div>
    ${c.observacoes ? `<h3>Observações</h3><p>${esc(c.observacoes)}</p>` : ""}
    ${c.documento && c.documento !== "#" ? `<p><a class="btn ghost" href="${esc(c.documento)}"${ext(c.documento)}>Ver documento oficial ${I.ext}</a></p>` : ""}
  </div>`;
}

/* ---------- RODAPÉ ---------- */
function renderFooter(){
  const lista = arr => `<ul>${arr.map(l => { const h = formLink(l.link); return `<li><a href="${esc(h)}"${ext(h)}>${esc(l.titulo)}</a></li>`; }).join("")}</ul>`;
  $("#footer").innerHTML = `<div class="footer-grid">
      <div><h4>Endereço</h4><div class="addr">${esc(C.endereco)}</div></div>
      <div><h4>Políticas</h4>${lista(C.politicas)}</div>
      <div><h4>Links úteis</h4>${lista(C.linksUteis)}</div>
    </div>
    <div class="copy">© ${hoje.getFullYear()} Agility Soluções · ${esc(C.setor)}</div>`;
}

/* ---------- ROTEAMENTO ---------- */
const RENDER = { home:pageHome, central:pageCentral, material:pageMaterial, plataformas:pagePlataformas, planilhas:pagePlanilhas,
  comunicacao:pageComunicacao, "quem-somos":pageQuemSomos, agenda:pageAgenda, comissionamento:pageComissionamento };
function rotaAtual(){ const r = location.hash.slice(1); return RENDER[r] ? r : "home"; }
function navegar(){
  const r = rotaAtual();
  if (pai[r]) abertos.add(pai[r].id);
  renderNav(r);
  $("#pageTitle").textContent = titulo[r];
  $("#breadcrumb").textContent = pai[r] ? `${pai[r].titulo} › ${titulo[r]}` : (r === "home" ? "" : titulo[r]);
  document.title = `${titulo[r]} — ${C.setor} | Agility`;
  $("#content").innerHTML = RENDER[r]();
  if (r === "home") montarIndicadores();
  fecharMenu();
  window.scrollTo(0,0);
}

/* menu mobile */
const fecharMenu = () => { $("#sidebar").classList.remove("open"); $("#overlay").classList.remove("show"); };
$("#menuBtn").onclick = () => { $("#sidebar").classList.add("open"); $("#overlay").classList.add("show"); };
$("#overlay").onclick = fecharMenu;

$("#setorNome").textContent = C.setor;
$("#sideFooter").textContent = camp ? camp.nome : "";
renderFooter();
window.addEventListener("hashchange", navegar);
navegar();
})();
</script>
</body>
</html>
